name: Release

# Tag `vX.Y.Z` -> build five targets, check each binary speaks LSP, publish a GitHub Release.
# workflow_dispatch is a dry run: it builds and packages everything but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and check the handshake
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          bin="$PWD/target/${{ matrix.target }}/release/ghp-lsp$ext"
          test -f "$bin"
          # The C runtime must be linked in (.cargo/config.toml): a PC without the VC++ Redistributable has no VCRUNTIME140.dll.
          if [ "$RUNNER_OS" = Windows ] && grep -qa 'VCRUNTIME140' "$bin"; then
            echo "$bin imports VCRUNTIME140.dll: crt-static is not in effect" >&2; exit 1
          fi
          "$bin" --version
          # initialize -> shutdown -> exit over stdio: the binary we ship must speak LSP, not just exist.
          msg() { printf 'Content-Length: %d\r\n\r\n%s' "${#1}" "$1"; }
          out="$({
            msg '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"capabilities":{}}}'
            msg '{"jsonrpc":"2.0","id":2,"method":"shutdown"}'
            msg '{"jsonrpc":"2.0","method":"exit"}'
          } | "$bin")" || true
          echo "$out" | grep '"capabilities"' >/dev/null || { echo "ghp-lsp did not answer initialize: $out" >&2; exit 1; }
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dryrun"
          name="ghp-lsp-${tag}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$BIN" LICENSE README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            file="$name.zip"
            7z a -tzip "$file" "$name" >/dev/null
          else
            file="$name.tar.gz"
            tar -czf "$file" "$name"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          rm -rf "$name"
          cat "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ghp-lsp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd assets
          ls -l
          [ "$(ls *.tar.gz *.zip | wc -l)" -eq 5 ] || { echo "expected 5 archives" >&2; exit 1; }
          cat *.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            { echo "Changes since $prev:"; echo; git log --no-merges --pretty='- %s (%h)' "$prev..${GITHUB_REF_NAME}"; } > notes.md
          else
            echo "First release of the GHP language server (stdio LSP for .ghp templates). See the README for editor setup." > notes.md
          fi
          printf '\nVerify downloads with `SHA256SUMS`.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" assets/* --title "ghp-lsp $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
